---
# cPanel Git™ Version Control runs this on "Deploy HEAD Commit".
#
# DEPLOYPATH is the subdomain's document root, as cPanel reported it when the
# subdomain was created. Everything else is in .cpanel/deploy.sh, which
# refuses to run if this path turns out to be the live WordPress site.
deployment:
  tasks:
    - export DEPLOYPATH=/home/argiccfx/new.argflex.co.uk
    - /bin/sh .cpanel/deploy.sh
